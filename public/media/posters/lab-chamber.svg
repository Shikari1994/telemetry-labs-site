<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="presentation">
  <defs>
    <linearGradient id="cSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63635d"/>
      <stop offset="0.12" stop-color="#8f8f88"/>
      <stop offset="0.30" stop-color="#e4e4de"/>
      <stop offset="0.42" stop-color="#f8f8f4"/>
      <stop offset="0.56" stop-color="#cbcbc4"/>
      <stop offset="0.74" stop-color="#8b8b83"/>
      <stop offset="1" stop-color="#4a4a44"/>
    </linearGradient>

    <!-- Pressure glass: cool, low-contrast, with a bright leading edge. -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8c2c4" stop-opacity="0.30"/>
      <stop offset="0.22" stop-color="#eef3f4" stop-opacity="0.55"/>
      <stop offset="0.44" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.70" stop-color="#9fabad" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6e797b" stop-opacity="0.44"/>
    </linearGradient>

    <linearGradient id="cHot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c3009"/>
      <stop offset="0.20" stop-color="#e5551b"/>
      <stop offset="0.44" stop-color="#ff8a4f"/>
      <stop offset="0.62" stop-color="#f0611c"/>
      <stop offset="1" stop-color="#8f2c07"/>
    </linearGradient>

    <radialGradient id="cDrop" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10100e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#10100e" stop-opacity="0"/>
    </radialGradient>

    <pattern id="cKnurl" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0.5H6" stroke="#10100e" stroke-opacity="0.15" stroke-width="1"/>
      <path d="M0 3.5H6" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>

    <clipPath id="glassClip"><rect x="330" y="250" width="340" height="740" rx="10"/></clipPath>
  </defs>

  <ellipse cx="500" cy="1148" rx="230" ry="30" fill="url(#cDrop)"/>

  <!-- Chamber cap -->
  <rect x="296" y="150" width="408" height="86" rx="8" fill="url(#cSteel)"/>
  <rect x="296" y="150" width="408" height="86" rx="8" fill="url(#cKnurl)"/>
  <rect x="296" y="150" width="408" height="86" rx="8" fill="none" stroke="#10100e" stroke-opacity="0.5" stroke-width="2"/>
  <g fill="#10100e" opacity="0.45">
    <circle cx="360" cy="193" r="9"/><circle cx="500" cy="193" r="9"/><circle cx="640" cy="193" r="9"/>
  </g>

  <!-- Instrument stack inside the glass -->
  <g clip-path="url(#glassClip)">
    <rect x="330" y="250" width="340" height="740" fill="#e7e7e1"/>
    <g>
      <rect x="410" y="286" width="180" height="104" fill="url(#cSteel)"/>
      <rect x="410" y="286" width="180" height="104" fill="url(#cKnurl)"/>
      <rect x="410" y="406" width="180" height="104" fill="url(#cHot)"/>
      <rect x="410" y="526" width="180" height="104" fill="url(#cSteel)"/>
      <rect x="410" y="526" width="180" height="104" fill="url(#cKnurl)"/>
      <rect x="410" y="646" width="180" height="104" fill="url(#cSteel)"/>
      <rect x="410" y="646" width="180" height="104" fill="url(#cKnurl)"/>
      <rect x="410" y="766" width="180" height="104" fill="url(#cSteel)"/>
      <rect x="410" y="766" width="180" height="104" fill="url(#cKnurl)"/>
      <rect x="410" y="886" width="180" height="70" fill="url(#cSteel)"/>
    </g>
    <g fill="none" stroke="#10100e" stroke-opacity="0.4" stroke-width="2">
      <rect x="410" y="286" width="180" height="104"/>
      <rect x="410" y="406" width="180" height="104"/>
      <rect x="410" y="526" width="180" height="104"/>
      <rect x="410" y="646" width="180" height="104"/>
      <rect x="410" y="766" width="180" height="104"/>
    </g>
    <!-- Glass over the stack -->
    <rect x="330" y="250" width="340" height="740" fill="url(#glass)"/>
    <!-- Reflection band -->
    <path d="M372 250h56v740h-56z" fill="#ffffff" opacity="0.30"/>
    <path d="M446 250h20v740h-20z" fill="#ffffff" opacity="0.16"/>
  </g>
  <rect x="330" y="250" width="340" height="740" rx="10" fill="none" stroke="#10100e" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Base -->
  <rect x="296" y="1004" width="408" height="96" rx="8" fill="url(#cSteel)"/>
  <rect x="296" y="1004" width="408" height="96" rx="8" fill="url(#cKnurl)"/>
  <rect x="296" y="1004" width="408" height="96" rx="8" fill="none" stroke="#10100e" stroke-opacity="0.5" stroke-width="2"/>
</svg>
