<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="presentation">
  <defs>
    <!-- Machined steel body: the highlight sits off-centre so the cylinder
         reads as a turned surface rather than a flat gradient. -->
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f6f6a"/>
      <stop offset="0.10" stop-color="#9a9a94"/>
      <stop offset="0.26" stop-color="#e8e8e2"/>
      <stop offset="0.38" stop-color="#fbfbf7"/>
      <stop offset="0.50" stop-color="#d5d5ce"/>
      <stop offset="0.63" stop-color="#a8a8a1"/>
      <stop offset="0.80" stop-color="#77776f"/>
      <stop offset="1" stop-color="#4d4d47"/>
    </linearGradient>

    <linearGradient id="steelDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a35"/>
      <stop offset="0.12" stop-color="#55554e"/>
      <stop offset="0.30" stop-color="#7e7e76"/>
      <stop offset="0.42" stop-color="#909089"/>
      <stop offset="0.56" stop-color="#6a6a63"/>
      <stop offset="0.78" stop-color="#43433e"/>
      <stop offset="1" stop-color="#2a2a26"/>
    </linearGradient>

    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8380f"/>
      <stop offset="0.16" stop-color="#e4581f"/>
      <stop offset="0.36" stop-color="#ff8146"/>
      <stop offset="0.50" stop-color="#ffa678"/>
      <stop offset="0.66" stop-color="#f5651f"/>
      <stop offset="0.85" stop-color="#bb3f10"/>
      <stop offset="1" stop-color="#8a2c08"/>
    </linearGradient>

    <!-- Contact shadow under the tool. -->
    <radialGradient id="drop" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10100e" stop-opacity="0.34"/>
      <stop offset="0.62" stop-color="#10100e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#10100e" stop-opacity="0"/>
    </radialGradient>

    <!-- Fine horizontal tooling marks. -->
    <pattern id="knurl" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none"/>
      <path d="M0 0.5H6" stroke="#10100e" stroke-opacity="0.16" stroke-width="1"/>
      <path d="M0 3.5H6" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>

    <clipPath id="bodyClip"><rect x="470" y="330" width="260" height="700" rx="6"/></clipPath>
    <clipPath id="lowerClip"><rect x="486" y="1030" width="228" height="270" rx="6"/></clipPath>
  </defs>

  <ellipse cx="600" cy="1372" rx="250" ry="34" fill="url(#drop)"/>

  <!-- Upper crossover sub -->
  <path d="M523 214h154l24 74H499z" fill="url(#steelDark)"/>
  <rect x="499" y="288" width="202" height="20" fill="url(#steel)"/>
  <rect x="499" y="288" width="202" height="20" fill="url(#knurl)"/>

  <!-- Main pressure housing -->
  <g clip-path="url(#bodyClip)">
    <rect x="470" y="330" width="260" height="700" fill="url(#steel)"/>
    <rect x="470" y="330" width="260" height="700" fill="url(#knurl)" opacity="0.5"/>
    <!-- Machined bands -->
    <g fill="url(#steelDark)">
      <rect x="470" y="392" width="260" height="16"/>
      <rect x="470" y="700" width="260" height="16"/>
      <rect x="470" y="962" width="260" height="16"/>
    </g>
    <!-- Sensor window: the one hot element, matching the accent token -->
    <rect x="470" y="470" width="260" height="176" fill="url(#hot)"/>
    <rect x="470" y="470" width="260" height="176" fill="url(#knurl)" opacity="0.35"/>
    <rect x="470" y="470" width="260" height="4" fill="#10100e" opacity="0.45"/>
    <rect x="470" y="642" width="260" height="4" fill="#10100e" opacity="0.45"/>
    <!-- Specular sweep -->
    <path d="M556 330h44v700h-44z" fill="#ffffff" opacity="0.22"/>
    <path d="M614 330h14v700h-14z" fill="#ffffff" opacity="0.10"/>
  </g>
  <rect x="470" y="330" width="260" height="700" rx="6" fill="none" stroke="#10100e" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Lower stabiliser -->
  <g clip-path="url(#lowerClip)">
    <rect x="486" y="1030" width="228" height="270" fill="url(#steelDark)"/>
    <g stroke="#10100e" stroke-opacity="0.5" stroke-width="14">
      <path d="M470 1070L730 1160"/>
      <path d="M470 1150L730 1240"/>
      <path d="M470 1230L730 1320"/>
    </g>
    <path d="M556 1030h40v270h-40z" fill="#ffffff" opacity="0.14"/>
  </g>
  <rect x="486" y="1030" width="228" height="270" rx="6" fill="none" stroke="#10100e" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Bit box -->
  <path d="M508 1300h184l-30 58H538z" fill="url(#steelDark)"/>
  <path d="M508 1300h184l-30 58H538z" fill="none" stroke="#10100e" stroke-opacity="0.5" stroke-width="2"/>
</svg>
